          {name:'컴활 1급 필기 (멘토시리즈)', url:'https://www.ddazua.com/local/course/detail.php?id=2405', hl:true},
          {name:'컴활 2급 필기', url:'https://www.ddazua.com/local/course/detail.php?id=2116'},
          {name:'컴활 실기', url:'https://www.ddazua.com/local/course/list.php?id=461'},
        ]},
        {label:'④ 회계', courses:[
          {name:'전산세무 2급 기출', url:'https://www.ddazua.com/local/course/detail.php?id=2139'},
          {name:'전산세무 2급 실기', url:'https://www.ddazua.com/local/course/detail.php?id=2140'},
          {name:'전산세무 2급 이론', url:'https://www.ddazua.com/local/course/detail.php?id=2141'},
        ]},
      ],
      certs:['컴활 1급','ITQ OA Master','전산세무 2급'],
    },
  ];

  function buildCard(dept) {
    const stages = dept.stages.map(s => `
      <div class="stage-row">
        <span class="stage-label">${s.label}</span>
        <div class="courses">
          ${s.courses.map(c => `<a class="course-tag${c.hl?' highlight':''}" href="${c.url}" target="_blank">${c.name}</a>`).join('')}
        </div>
      </div>
    `).join('');
    const certs = dept.certs.map(c => `<span class="cert-badge">${c}</span>`).join('');
    return `
      <div class="dept-card">
        <div class="dept-header">
          <div class="dept-icon ${dept.icon}"><i class="${dept.iconClass}"></i></div>
          <div>
            <div class="dept-title">${dept.title}</div>
            <div class="dept-sub">${dept.sub}</div>
          </div>
        </div>
        <div class="dept-body">
          ${stages}
          <div class="cert-row">
            <span class="cert-label">취득 목표 자격증</span>
            ${certs}
          </div>
        </div>
      </div>
    `;
  }

  // 렌더링
  document.getElementById('allGrid').innerHTML = DEPTS.map(buildCard).join('');
  DEPTS.forEach(d => {
    document.getElementById('g'+d.id).innerHTML = buildCard(d);
  });

  function setTab(idx, btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p'+idx).classList.add('active');
  }
  </script>
</body>
</html>
